<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>성윤누나 🌹</title>
<style>
  :root { --pink:#ff5f8f; --deep:#3d2630; --soft:#fff3f7; }
  *{box-sizing:border-box}
  html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
  body{
    margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:24px; overflow-x:hidden; overflow-y:auto; color:var(--deep);
    -webkit-overflow-scrolling:touch;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
    background:radial-gradient(circle at 20% 10%,#fff 0 12%,transparent 35%),
               linear-gradient(145deg,#fff5f8,#ffe9f0);
  }
  .petals{position:fixed;inset:0;pointer-events:none}
  .petal{position:absolute;font-size:22px;opacity:.55;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
  .wrap{width:100%;max-width:430px;min-width:0;text-align:center;position:relative;z-index:1;margin:12px auto 30px}
  .brand{font-size:15px;font-weight:800;letter-spacing:.3px;color:#a35c70;margin-bottom:20px}
  .card{
    background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.95);
    border-radius:30px; padding:28px 22px 24px;
    box-shadow:0 22px 70px rgba(155,71,99,.18);
    backdrop-filter:blur(10px);
  }
  .cat{
    width:130px;height:130px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#fff,#ffe6ef);
    font-size:74px; box-shadow:inset 0 0 0 7px #fff,0 12px 28px rgba(255,95,143,.12);
  }
  h1{font-size:29px;margin:4px 0 12px}
  .message{font-size:18px;line-height:1.65;margin:0 auto 20px}
  .date{
    background:#fff7fa;border-radius:20px;padding:14px 16px;margin:18px 0 22px;
    font-size:16px;line-height:1.7;
  }
  .date strong{color:#e84977}
  .buttons{display:flex;gap:12px;justify-content:center}
  button{
    border:0; touch-action:manipulation;border-radius:15px;padding:14px 25px;font-size:17px;font-weight:800;
    cursor:pointer;transition:transform .18s,box-shadow .18s;
    min-width:125px;
  }
  #yes{background:var(--pink);color:white;box-shadow:0 10px 25px rgba(255,95,143,.3)}
  #no{background:#f0ecee;color:#5f5157;position:relative}
  button:hover{transform:translateY(-2px)}
  .hint{font-size:13px;color:#a47a88;margin:15px 0 0;min-height:20px}
  .result{display:none;margin-top:20px;padding:20px;border-radius:20px;background:#fff0f5}
  .result h2{margin:0 0 8px;color:#e84977}
  .choice-section{margin:18px 0 22px}
  .choice-title{font-weight:800;margin-bottom:10px}
  .choice-select{
    width:100%; max-width:330px; padding:14px 16px; border-radius:14px;
    border:1px solid #ffd0dd; background:#fff; color:#e84977;
    font-size:16px; font-weight:700; outline:none; cursor:pointer;
  }
  .choice-select:focus{border-color:#ff5f8f;box-shadow:0 0 0 3px rgba(255,95,143,.12)}
  .selected-choice{margin-top:9px;color:#e84977;font-weight:800;min-height:24px}
  .time-btn{background:#fff;color:#e84977;border:1px solid #ffd0dd;min-width:135px;padding:12px 16px;font-size:15px}
  .time-btn.selected{background:#ff5f8f;color:#fff;box-shadow:0 8px 18px rgba(255,95,143,.22)}
  .celebration{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:999;
  }
  .celebration-heart{
    position:absolute;
    bottom:18%;
    font-size:24px;
    animation:heartBurst 1.8s ease-out forwards;
    will-change:transform,opacity;
  }
  @keyframes heartBurst{
    0%{transform:translate(0,0) scale(.6) rotate(0deg);opacity:0}
    12%{opacity:1}
    100%{transform:translate(var(--x),-75vh) scale(1.35) rotate(var(--r));opacity:0}
  }
  .confetti{
    position:absolute;
    top:-20px;
    width:9px;
    height:14px;
    border-radius:2px;
    animation:confettiFall 2.2s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--x),110vh) rotate(720deg);opacity:0}
  }
  .share{margin-top:20px;font-size:13px;color:#987682}
  .share button{min-width:auto;background:#fff;color:#e84977;border:1px solid #ffd0dd;font-size:14px;padding:10px 16px}
</style>
</head>
<body>
<div id="celebration" class="celebration" aria-hidden="true"></div>
<div class="petals">
  <span class="petal" style="left:8%;animation-duration:9s">🌸</span>
  <span class="petal" style="left:25%;animation-duration:12s;animation-delay:2s">♡</span>
  <span class="petal" style="left:52%;animation-duration:10s;animation-delay:4s">🌷</span>
  <span class="petal" style="left:78%;animation-duration:13s;animation-delay:1s">♡</span>
  <span class="petal" style="left:92%;animation-duration:11s;animation-delay:5s">🌸</span>
</div>

<div class="wrap">
  <div class="brand">🌹 성윤누나</div>
  <section class="card">
    <div class="cat" aria-hidden="true">🐱💗</div>
    <h1>성윤누나, 목요일에 아웃백</h1>
    <p class="message">탄이가 조심스럽게 데이트 신청합니다 😊<br>같이 맛있는 거 먹으러 갈래요?</p>

    <div class="date">
      📅 <strong>8월 27일 목요일</strong><br>
      📍 <strong>테크노파크 아웃백</strong>
    </div>

    <div class="choice-section">
      <div class="choice-title">🕖 몇 시가 좋아요?</div>
      <select id="timeSelect" class="choice-select" onchange="chooseTime(this)">
        <option value="">시간을 선택해주세요</option>
        <option value="저녁 6시">저녁 6시</option>
        <option value="저녁 6시 30분">저녁 6시 30분</option>
        <option value="저녁 7시">저녁 7시</option>
        <option value="저녁 7시 30분">저녁 7시 30분</option>
        <option value="저녁 8시">저녁 8시</option>
      </select>
      <div id="selectedTime" class="selected-choice"></div>
    </div>

    <div class="buttons">
      <button id="yes" onclick="yes()">Yes 💗</button>
      <button id="no" onclick="nope()">No</button>
    </div>
    <div id="hint" class="hint">No seems a bit shy 💖</div>

    <div id="result" class="result">
      <h2>아싸 넘 좋아요... ❤️</h2>
      <div>27일 목요일 <strong id="confirmedTime"></strong>에 만나요!</div>
    </div>

    <div class="share">
      이 페이지를 공유해 주세요 💌<br>
      <button onclick="copyLink()">🔗 링크 복사</button>
    </div>
  </section>
</div>

<script>
/*
  1) Create a Google Apps Script Web App using the code in
     seongyun_date_rsvp_google_apps_script.txt
  2) Paste your Web App URL below.
*/
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaEQzZ02E9iDZ0uIA3yWqGi10YX8f8CpIMzCvT6gPXkWEEqU5n0SDCkYCow6mcv26x/exec";

const no = document.getElementById("no");
const hint = document.getElementById("hint");
let count = 0;
let selectedTime = "";

function chooseTime(select){
  selectedTime = select.value;
  document.getElementById("selectedTime").textContent =
    selectedTime ? selectedTime + "로 선택했어요 💗" : "";
}

async function sendResponse(answer){
  if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")){
    return false;
  }
  const params = new URLSearchParams({
    answer: answer,
    selectedTime: selectedTime || "",
    date: "2026-08-27",
    location: "테크노파크 아웃백",
    invitedPerson: "성윤누나",
    inviter: "탄이"
  });
  try{
    await fetch(GOOGLE_SCRIPT_URL + "?" + params.toString(), {
      method: "GET",
      mode: "no-cors"
    });
    return true;
  }catch(e){
    return false;
  }
}

async function yes(){
  if(!selectedTime){
    hint.textContent="먼저 원하는 시간을 골라주세요 😊";
    document.getElementById("timeSelect").animate(
      [{transform:"scale(1)"},{transform:"scale(1.05)"},{transform:"scale(1)"}],
      {duration:400}
    );
    return;
  }

  document.getElementById("yes").disabled=true;
  document.getElementById("no").style.display="none";
  hint.textContent="응답을 저장하는 중... 💌";

  await sendResponse("YES");

  document.getElementById("result").style.display="block";
  document.getElementById("confirmedTime").textContent = selectedTime;
  hint.textContent="좋아요! 탄이가 기다리고 있을게요 🥰";
  document.getElementById("yes").textContent="Confirmed! ❤️";
  celebrate();
}

function celebrate(){
  const box = document.getElementById("celebration");
  box.innerHTML = "";

  const hearts = ["❤️","💗","💕","💖","💘"];
  for(let i=0;i<18;i++){
    const heart = document.createElement("span");
    heart.className = "celebration-heart";
    heart.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left = (50 + (Math.random()*20-10)) + "%";
    heart.style.setProperty("--x", (Math.random()*240-120) + "px");
    heart.style.setProperty("--r", (Math.random()*360-180) + "deg");
    heart.style.animationDelay = (Math.random()*0.35) + "s";
    box.appendChild(heart);
  }

  for(let i=0;i<45;i++){
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.style.left = Math.random()*100 + "%";
    piece.style.setProperty("--x", (Math.random()*180-90) + "px");
    piece.style.animationDelay = (Math.random()*0.35) + "s";
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(piece);
  }

  setTimeout(() => box.innerHTML = "", 2800);
}

async function nope(){
  count++;

  if(selectedTime){
    await sendResponse("NO");
  }

  const messages=[
    "No seems a bit shy 💖",
    "정말 No인가요? 🥺",
    "한 번만 더 생각해봐요 😳",
    "ㅋㅋㅋ 꼭 YES 눌러야 돼요 😆",
    "ㅋㅋㅋ 꼭 YES 눌러야 돼요 😆"
  ];

  hint.textContent=messages[Math.min(count-1,messages.length-1)];

  if(count >= 4){
    no.style.transition="opacity .35s, transform .35s";
    no.style.opacity="0";
    no.style.transform="scale(0.2)";
    no.style.pointerEvents="none";
    setTimeout(() => {
      no.style.display="none";
    }, 350);
    return;
  }

  const x=Math.floor(Math.random()*120)-60;
  const y=Math.floor(Math.random()*70)-35;
  no.style.transform=`translate(${x}px,${y}px)`;
}

async function copyLink(){
  try{
    await navigator.clipboard.writeText(location.href);
    hint.textContent="링크가 복사됐어요! 💌";
  }catch(e){
    hint.textContent="브라우저 주소를 복사해서 보내주세요 💗";
  }
}
</script>
</body>
</html>
